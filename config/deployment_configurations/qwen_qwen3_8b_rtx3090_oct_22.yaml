# Qwen3-8B on rtx3090-oct-22: symmetric weight-only 4-bit GPTQ candidate.
# The setup script pins and prepares JunHowie/Qwen3-8B-GPTQ-Int4.
# Activations, embeddings, and lm_head retain bfloat16 precision.
# Keep the public model identifier, context cap, and memory cap unchanged.
# Generation defaults are those of the original model.
model: Qwen/Qwen3-8B
hardware: rtx3090-oct-22
vllm_options:
  max_model_len: 24576
  gpu_memory_utilization: 0.6
