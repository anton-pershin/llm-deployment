# Qwen3-8B on rtx3090-oct-22: original BF16 Q/K/V with AWQ MLP weights.
# The setup script pins both official source checkpoints and prepares the hybrid.
# Keep bfloat16 activations and specialize CUDA graphs for small batches.
# Explicit greedy decoding is the default; callers can override it.
model: Qwen/Qwen3-8B
hardware: rtx3090-oct-22
vllm_options:
  max_model_len: 24576
  gpu_memory_utilization: 0.6
  dtype: bfloat16
  linear_backend: marlin
  max_num_seqs: 8
  compilation_config: '{"mode":3,"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,3,4,5,6,7,8],"compile_sizes":[1,2,3,4,5,6,7,8]}'
  override_generation_config: '{"temperature":0.0}'